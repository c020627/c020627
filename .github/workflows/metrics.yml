# GitHub Metrics —— 需要 GH_TOKEN secret（一个带 repo 权限的 PAT）
#
# 启用步骤：
#   1. 生成 PAT：https://github.com/settings/tokens  （勾选 repo + read:user）
#   2. 在仓库 Settings → Secrets and variables → Actions 新建 secret，名字填 GH_TOKEN
#   3. 取消下面 schedule 的注释，或直接在 Actions 页面手动 Run workflow
#
# 跑完后取消 README 里 GitHub Metrics 区块的注释即可看到 7 张图。
name: GitHub Metrics

on:
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: c020627
          template: classic
          base: "header, activity, community, repositories"
          config_timezone: Asia/Shanghai
          filename: github-metrics/base.svg
          plugin_traffic: yes
          plugin_lines: yes
          plugin_introduction: yes

  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: c020627
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: github-metrics/languages.indepth.svg
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

  reactions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: c020627
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: github-metrics/reactions.svg
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_details: count, percentage

  followup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: c020627
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: github-metrics/followup.indepth.svg
          plugin_followup: yes
          plugin_followup_indepth: yes

  repositories:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: c020627
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: github-metrics/repositories.pinned.svg
          plugin_repositories: yes
          plugin_repositories_featured: c020627/LingXiAgent

  stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: c020627
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: github-metrics/stars.svg
          plugin_stars: yes
          plugin_stars_limit: 4

  stargazers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: c020627
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: github-metrics/stargazers.chartist.svg
          plugin_stargazers: yes
          plugin_stargazers_charts_type: chartist

  isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: c020627
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          filename: github-metrics/isocalendar.fullyear.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
