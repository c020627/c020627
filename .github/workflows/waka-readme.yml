# WakaTime 编码时长统计 —— 需要 WAKATIME_API_KEY + GH_TOKEN 两个 secret
#
# 启用步骤：
#   1. 注册 https://wakatime.com 并在 IDE 里装 WakaTime 插件，让它开始记录
#   2. 到 https://wakatime.com/settings/api-key 复制 API Key
#   3. 在仓库 Secrets 里新建 WAKATIME_API_KEY（填 API Key）和 GH_TOKEN（填 PAT）
#   4. 取消下面 schedule 的注释，或手动 Run workflow
#
# 这个 action 会自己在 README 里找 <!--START_SECTION:waka--> / <!--END_SECTION:waka-->
# 标记并把统计写进去，所以启用前需要先把这对标记加回 README。
name: Waka Readme

on:
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_LINES_OF_CODE: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE: "True"
          SHOW_OS: "True"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_EDITORS: "True"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
